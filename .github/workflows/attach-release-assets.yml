name: Attach release assets

# The builds committed under deliverables/ are the same files the website
# serves. This puts them on the matching release as real assets, so the
# release page has files to download instead of links into the repository.
# It only attaches what is already committed; nothing is rebuilt here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the files to
        required: true
        default: v0.0.1

permissions:
  contents: write

concurrency:
  group: attach-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Clean asset names: GitHub turns spaces into dots, and the universal
      # APK should read the same here as it does on the website.
      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p stage
          cp "deliverables/Comfort 0.0.1.apk" stage/Comfort-v0.0.1.apk
          cp deliverables/Comfort-0.0.1-arm64-v8a-release.apk stage/
          cp deliverables/Comfort-0.0.1-armeabi-v7a-release.apk stage/
          cp deliverables/Comfort-0.0.1-release.aab stage/
          sha256sum stage/*

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" stage/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
