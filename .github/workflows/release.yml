name: Release

# A version bump on main builds the signed APKs — one per ABI and a universal
# one — and publishes them on the release the app updates itself from. Nobody
# has to cut a tag, publish a draft or upload a file: the app reads whatever
# the latest published release is, so an unpublished build is a build no phone
# can find.
#
# A tag like v2.2.4 still triggers the same thing, for a release cut by hand.
# Run by hand, it builds and signs the same way but only keeps the APK as an
# artifact, which is how the setup can be tried without publishing.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          # A tag that says one version over a build that says another would
          # publish an update the app then offers again forever.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - uses: ./.github/actions/setup

      # The keystore goes to the runner's temporary directory, outside the
      # checkout, and the runner is thrown away when the job ends.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::the signing secrets are not set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/square-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/square-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: ./gradlew :app:assembleRelease --stacktrace

      # Without the right key an update does not install over the app people
      # already have, and the build would not say so: a missing keystore falls
      # back to the debug key. So the certificate is checked against the one
      # every release from 0.0.4 on carries — the key held in the repository's
      # signing secrets, and nothing else.
      #
      # The apksigner is the one from the build-tools the setup installs, not
      # whichever is newest on the runner, and what it prints is shown: a
      # certificate is public, anyone can read it off the APK, and the first
      # run failed here with nothing to go on.
      #
      # Every split is checked, and copied under the name the app's updater
      # looks for: it picks the one naming the phone's ABI, then "universal".
      - name: Check the signature
        run: |
          set -o pipefail
          for abi in arm64-v8a armeabi-v7a universal; do
            apk=app/build/outputs/apk/release/app-$abi-release.apk
            certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
            echo "$certs"
            digest=$(echo "$certs" | sed -n 's/^Signer.*certificate SHA-256 digest: //p' | head -n 1)
            if [ "$digest" != "9b3e6267f6617c4a623bd281d3e4093629fbb58c377828497a67a5f18ac920fb" ]; then
              echo "::error::$abi signed with ${digest:-nothing}, not the release key"
              exit 1
            fi
            cp "$apk" "square-${{ steps.version.outputs.name }}-$abi.apk"
          done

      - name: Publish release
        if: github.ref_type == 'tag' || github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        # Published, not drafted: the app updates itself from the latest
        # published release, and a draft is a release no phone can see.
        #
        # arm64 first, and on its own: the updater in 2.4.2 and earlier takes
        # the first APK it finds, every phone that has one of those is 64-bit,
        # and gh uploads several files at once in no fixed order.
        # The notes are written in docs/release-notes.md and shown both on the
        # releases page and in the app's own update sheet, which reads whatever
        # this release says about itself. A release with no body is a sheet with
        # nothing under the version number.
        run: |
          set -euo pipefail
          name="square-${{ steps.version.outputs.name }}"
          tag="v${{ steps.version.outputs.name }}"
          notes=docs/release-notes.md
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty"
            exit 1
          fi
          # Asked of the remote, not of the checkout: this job fetches one
          # commit and no tags, so the local answer was "no tag" for a tag that
          # existed, and pushing it again failed the run with "already exists".
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --draft=false --notes-file "$notes"
          else
            gh release create "$tag" --verify-tag \
              --title "${{ steps.version.outputs.name }}" --notes-file "$notes"
          fi
          gh release upload "$tag" "$name-arm64-v8a.apk" --clobber
          gh release upload "$tag" "$name-armeabi-v7a.apk" "$name-universal.apk" --clobber

      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: square-${{ steps.version.outputs.name }}-signed
          path: square-${{ steps.version.outputs.name }}-*.apk
          retention-days: 7
          if-no-files-found: error
